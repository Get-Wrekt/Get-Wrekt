<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloop Survival</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #202820;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    #game-wrap {
      position: relative;
      width: min(1000px, 100vw);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #5c9b41;
      border: 2px solid #141914;
    }

    #wave-preview {
      position: absolute;
      z-index: 2;
      top: 68px;
      left: 34px;
      min-width: 205px;
      max-width: min(320px, calc(100% - 48px));
      padding: 10px 12px;
      color: #fff;
      background: transparent;
      border: 2px solid #f5d741;
      border-radius: 8px;
      pointer-events: none;
      text-shadow: 1px 1px 2px #141914, -1px -1px 2px #141914;
    }

    #wave-preview h3 {
      margin: 0 0 8px;
      color: #f5d741;
      font-size: 16px;
    }

    .preview-enemy {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
      font-size: 14px;
    }

    .gloop-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      box-shadow: 0 0 2px #141914;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0,0,0,.78);
    }

    #panel {
      width: min(900px, 100%);
      max-height: 95%;
      overflow: auto;
      padding: 22px;
      text-align: center;
      background: #202820;
      border: 3px solid #f5d741;
      border-radius: 12px;
    }

    /* Home screen: leaderboard on the left, original menu on the right. */
    #panel.home-panel {
      width: min(1200px, calc(100vw - 24px));
      padding: 18px;
    }
    .home-layout {
      display: grid;
      grid-template-columns: minmax(300px, .95fr) minmax(320px, 1.05fr);
      align-items: start;
      gap: 26px;
      text-align: center;
    }
    .home-main {
      min-width: 0;
      padding: 4px 14px 10px;
      align-self: start;
      /* Keep the menu centered in the visible panel even when the leaderboard is tall. */
      position: sticky;
      top: 50%;
      transform: translateY(-50%);
    }
    .home-main h1 { margin-top: 0; }
    .version-label {
      margin: 4px 0 0;
      color: #aeb8a8;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .season-label {
      margin: 0 0 8px;
      color: #a9ff62;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(123, 255, 65, .35);
    }
    button[data-mode="Apocalypse"] {
      color: #f6e8ff;
      background: #54246b;
      border-color: #c879ff;
    }
    button[data-mode="Apocalypse"]:hover:not(:disabled) {
      background: #71328d;
    }

    h1, h2 { color: #f5d741; }
    h2 { margin-bottom: 8px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 16px 0;
    }

    .shop-layout {
      display: grid;
      grid-template-columns: minmax(190px, 240px) 1fr;
      gap: 14px;
      align-items: start;
      text-align: left;
    }

    .inventory {
      position: sticky;
      top: 0;
      padding: 14px;
      border: 1px solid #71806b;
      border-radius: 8px;
      background: #293329;
    }

    .inventory h2, .inventory h3 { margin-top: 0; }
    .inventory label { display: block; margin-top: 12px; }

    .inventory select {
      width: 100%;
      margin-top: 5px;
      padding: 9px;
      color: #fff;
      background: #141914;
      border: 1px solid #f5d741;
      border-radius: 5px;
    }

    .inventory ul { padding-left: 20px; }
    .inventory li { margin: 7px 0; }

    .upgrade-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .shop-layout .upgrade-list { margin-top: 0; }

    .upgrade-card {
      padding: 12px;
      border: 1px solid #71806b;
      border-radius: 8px;
      background: #293329;
    }

    .upgrade-card p {
      min-height: 40px;
      margin: 8px 0;
      font-size: 14px;
    }

    button {
      padding: 11px 14px;
      border: 2px solid #f5d741;
      border-radius: 6px;
      color: #141914;
      background: #f5d741;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #ffe978; }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #upgrade-status { min-height: 22px; color: #ffe978; }

    .tutorial-content {
      max-width: 760px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.35;
    }

    .tutorial-content h2 { margin: 14px 0 8px; }
    .tutorial-intro { margin: 5px 0 10px; color: #dce5d5; }
    .tutorial-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .tutorial-control, .tutorial-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
      border: 1px solid #53614e;
      border-radius: 8px;
      background: #293329;
      min-width: 0;
    }
    .tutorial-control-icon {
      display: grid;
      place-items: center;
      width: 46px;
      min-width: 46px;
      height: 42px;
      border-radius: 6px;
      background: #141914;
      color: #f5d741;
      font-size: 20px;
      font-weight: bold;
    }
    .tutorial-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .tutorial-card { align-items: center; }
    .tutorial-sprite {
      width: 54px;
      height: 54px;
      min-width: 54px;
      display: grid;
      place-items: center;
    }
    .tutorial-sprite svg { display: block; width: 100%; height: 100%; }
    .tutorial-card strong, .tutorial-control strong { display: block; color: #f5d741; margin-bottom: 3px; }
    .tutorial-card span, .tutorial-control span { display: block; font-size: 13px; color: #edf1e9; }
    .tutorial-pickup { font-size: 36px; line-height: 1; }
    .tutorial-note {
      margin: 10px 0;
      padding: 10px;
      border-left: 3px solid #c879ff;
      background: #33283b;
      border-radius: 4px;
    }
    @media (max-width: 560px) {
      .tutorial-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tutorial-controls { grid-template-columns: 1fr; }
      .tutorial-card { padding: 7px; gap: 6px; }
      .tutorial-sprite { width: 44px; height: 44px; min-width: 44px; }
    }


    .leaderboard-box {
      width: 100%;
      max-width: 680px;
      margin: 18px auto;
      padding: 14px;
      text-align: left;
      border: 2px solid #71806b;
      border-radius: 8px;
      background: #293329;
    }

    .leaderboard-box h2 { text-align: center; margin-top: 0; }
    .leaderboard-difficulty-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 12px 0 16px;
    }
    .leaderboard-difficulty-tabs button {
      flex: 1 1 auto;
      padding: 8px 10px;
      border-width: 1px;
      font-size: 13px;
    }
    .leaderboard-difficulty-tabs button[aria-pressed="false"] {
      color: #f5f5f5;
      background: #293329;
      border-color: #71806b;
    }
    .leaderboard-difficulty-tabs button[aria-pressed="false"]:hover {
      background: #3b4939;
    }
    .nickname-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .nickname-row input {
      flex: 1 1 180px;
      min-width: 0;
      padding: 10px;
      border: 1px solid #71806b;
      border-radius: 5px;
      background: #141914;
      color: #fff;
      font: inherit;
    }
    #leaderboard-status { min-height: 20px; margin: 8px 0; color: #ffe978; font-size: 13px; }
    .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .leaderboard-table th, .leaderboard-table td { padding: 8px 5px; border-bottom: 1px solid #53614e; text-align: right; }
    .leaderboard-table th:first-child, .leaderboard-table td:first-child,
    .leaderboard-table th:nth-child(2), .leaderboard-table td:nth-child(2) { text-align: left; }
    .leaderboard-empty { text-align: center !important; color: #cbd5c0; }

    @media (max-width: 700px) {
      #panel.home-panel { width: min(560px, calc(100vw - 16px)); padding: 12px; }
      .home-layout { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .home-main { grid-row: 1; padding: 4px; position: static; top: auto; transform: none; }
      .home-layout .leaderboard-box { grid-row: 2; margin: 8px 0; }
      .leaderboard-box { padding: 10px; }
      .leaderboard-table { font-size: 12px; }
      .leaderboard-table th, .leaderboard-table td { padding: 6px 3px; }
      #panel { padding: 14px; }
      .shop-layout { grid-template-columns: 1fr; }
      .inventory { position: static; }
      .upgrade-list { grid-template-columns: 1fr; }
      #wave-preview { top: 66px; left: 10px; }
    }
  </style>
</head>
<body>
  <main id="game-wrap">
    <canvas id="game" width="1000" height="650"></canvas>
    <div id="wave-preview"></div>
    <section id="overlay">
      <div id="panel"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    "use strict";

    // Add your Supabase project's URL and publishable (anon) key here.
    // Supabase Dashboard -> Project Settings -> API.
    // NEVER put a secret key or service_role key in this HTML file.
    const SUPABASE_URL = "https://pdtswzuxjosacoowyixa.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_C9ufs6nEsJnGIYPnUD2UxQ_UtdJvSJc";
    const supabaseConfigured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("PASTE_YOUR") &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR");
    const supabaseClient = supabaseConfigured && window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    function getSavedNickname() {
      try { return localStorage.getItem("gloopSurvivalNickname") || ""; }
      catch { return ""; }
    }

    function saveNickname(value) {
      const nickname = String(value || "").trim().slice(0, 20);
      try { localStorage.setItem("gloopSurvivalNickname", nickname); } catch {}
      return nickname;
    }

    const leaderboardDifficulties = ["Very Easy", "Easy", "Medium", "Hard", "Impossible", "Apocalypse"];
    let selectedLeaderboardDifficulty = "Very Easy";

    function updateLeaderboardDifficultyTabs() {
      panel.querySelectorAll("[data-leaderboard-difficulty]").forEach(button => {
        const isSelected = button.dataset.leaderboardDifficulty === selectedLeaderboardDifficulty;
        button.setAttribute("aria-pressed", String(isSelected));
      });
    }

    async function loadLeaderboard() {
      const status = panel.querySelector("#leaderboard-status");
      const body = panel.querySelector("#leaderboard-rows");
      if (!status || !body) return;
      if (!supabaseClient) {
        status.textContent = "Leaderboard not connected yet. Add your Supabase URL and publishable key in the HTML file.";
        body.innerHTML = '<tr><td class="leaderboard-empty" colspan="6">Waiting for Supabase setup</td></tr>';
        return;
      }
      status.textContent = "Loading leaderboard…";
      try {
        const { data, error } = await supabaseClient
          .from("leaderboard")
          .select("player_name, wave_difficulty, coins, waves, created_at");
        if (error) throw error;
        // Each tab shows personal bests for one difficulty only.
        // Ranking: highest waves, then highest coins, then newest record.
        const rankedData = (data || [])
          .filter(entry => entry.wave_difficulty === selectedLeaderboardDifficulty)
          .sort((a, b) =>
            (Number(b.waves) || 0) - (Number(a.waves) || 0) ||
            (Number(b.coins) || 0) - (Number(a.coins) || 0) ||
            new Date(b.created_at || 0) - new Date(a.created_at || 0)
          )
          .slice(0, 10);
        if (rankedData.length === 0) {
          body.innerHTML = `<tr><td class="leaderboard-empty" colspan="6">No ${escapeHtml(selectedLeaderboardDifficulty)} records yet. Be the first to play!</td></tr>`;
        } else {
          body.innerHTML = rankedData.map((entry, index) => `
            <tr>
              <td>${index + 1}</td>
              <td>${escapeHtml(entry.player_name)}</td>
              <td>${escapeHtml(entry.wave_difficulty || "Unknown")}</td>
              <td>${Number(entry.waves) || 0}</td>
              <td>${Number(entry.coins) || 0}</td>
              <td>${entry.created_at ? new Date(entry.created_at).toLocaleDateString() : "—"}</td>
            </tr>
          `).join("");
        }
        status.textContent = `Top 10 personal bests for ${selectedLeaderboardDifficulty} — ranked by waves, then coins`;
      } catch (error) {
        console.error("Leaderboard load failed:", error);
        status.textContent = "Could not load scores. Check the Supabase URL, key, table, and access policies.";
        body.innerHTML = '<tr><td class="leaderboard-empty" colspan="6">Leaderboard temporarily unavailable</td></tr>';
      }
    }

    async function submitRunScore() {
      const nickname = getSavedNickname();
      const result = panel.querySelector("#score-submit-status");
      if (!nickname) {
        if (result) result.textContent = "Score not submitted: choose a nickname on the home screen before your next run.";
        return;
      }
      if (!supabaseClient) {
        if (result) result.textContent = "Score not submitted yet: Supabase connection details still need to be added.";
        return;
      }
      try {
        // The database function keeps one personal-best row per exact nickname.
        // It only replaces the saved row for more waves, or equal waves with more coins.
        const { data: improved, error } = await supabaseClient.rpc("submit_player_best", {
          p_player_name: nickname,
          p_wave_difficulty: selectedMode,
          p_coins: Math.max(0, Math.floor(runCoins)),
          p_waves: Math.max(0, Math.floor(wave))
        });
        if (error) throw error;
        if (result) {
          result.textContent = improved
            ? "Personal best saved to the leaderboard!"
            : "Personal best kept — this run did not beat your saved record.";
        }
        await loadLeaderboard();
      } catch (error) {
        console.error("Score submission failed:", error);
        if (result) result.textContent = "Could not save your personal best. Check the Supabase submit_player_best function and permissions.";
      }
    }

    const canvas = document.querySelector("#game");
    const overlay = document.querySelector("#overlay");
    const panel = document.querySelector("#panel");
    const previewElement = document.querySelector("#wave-preview");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;
    const bounds = { left: 25, top: 75, right: W - 25, bottom: H - 25 };

    const MAX_HYPNOTIZED_ENEMIES = 10;
    const PLAYER_HITBOX_SCALE = 0.8;
    const ENEMY_HITBOX_SCALE = 0.6;

    const FLAME_RANGE = 60;
    const FLAME_DAMAGE = 5;
    const FLAME_COOLDOWN = 1;
    const BURN_DURATION = 3;
    const SNIPER_BURN_DURATION = 5;
    const FREEZE_DURATION = 2;

    const mergerCenter = {
      x: (bounds.left + bounds.right) / 2,
      y: (bounds.top + bounds.bottom) / 2
    };

    const modes = {
      "Very Easy": { waveDuration: 20 },
      "Easy": { waveDuration: 15 },
      "Medium": { waveDuration: 13 },
      "Hard": { waveDuration: 9 },
      "Impossible": { waveDuration: 3 },
      // Apocalypse is a special seasonal mode with its own leaderboard.
      "Apocalypse": { waveDuration: 8 }
    };

    let selectedMode = "Medium";
    let waveDuration = modes[selectedMode].waveDuration;

    const bossHealthScaling = {
      "Very Easy": { firstPercent: 80, firstIncrement: 50 },
      "Easy": { firstPercent: 90, firstIncrement: 60 },
      "Medium": { firstPercent: 100, firstIncrement: 80 },
      "Hard": { firstPercent: 120, firstIncrement: 90 },
      "Impossible": { firstPercent: 150, firstIncrement: 100 },
      "Apocalypse": { firstPercent: 170, firstIncrement: 110 }
    };

    function getBossHealthPercent(bossNumber, mode = selectedMode) {
      const settings = bossHealthScaling[mode] || bossHealthScaling.Medium;
      const index = Math.max(0, bossNumber - 1);

      return settings.firstPercent +
        index * settings.firstIncrement +
        5 * index * (index - 1);
    }

    const weapons = {
      Pistol: { damage: 40, cooldown: 0.24, speed: 760, pellets: 1, spread: 0 },
      "AK-47": { damage: 18, cooldown: 0.10, speed: 800, pellets: 1, spread: 0.08 },
      Shotgun: { damage: 27, cooldown: 0.50, speed: 700, pellets: 6, spread: 0.28 },
      Sniper: { damage: 140, cooldown: 0.90, speed: 1150, pellets: 1, spread: 0 },
      "Grenade Launcher": { damage: 65, cooldown: 0.72, speed: 500, pellets: 1, spread: 0 }
    };

    const gunPrices = {
      "AK-47": 150,
      Shotgun: 200,
      Sniper: 300,
      "Grenade Launcher": 350
    };

    const weaponMilestones = {
      Pistol: {
        3: "Bullets burn enemies hit for 3 seconds.",
        5: "Bullets explode on impact with half the Grenade Launcher radius.",
        10: "Explosions also burn enemies in their radius for 3 seconds.",
        15: "Bullets hypnotise enemies hit; hypnotised enemies fight for you."
      },
      Shotgun: {
        3: "Pellets burn enemies hit for 3 seconds.",
        5: "Pellets explode on impact with half the Grenade Launcher radius.",
        10: "Explosions also burn enemies in their radius for 3 seconds.",
        15: "Pellets hypnotise enemies hit; hypnotised enemies fight for you."
      },
      Sniper: {
        3: "Bullets penetrate up to 2 enemies.",
        5: "Bullets penetrate up to 5 enemies.",
        10: "Bullets burn enemies hit for 5 seconds.",
        15: "Bullets hypnotise enemies hit; hypnotised enemies fight for you."
      },
      "AK-47": {
        3: "Bullets penetrate 1 enemy.",
        5: "Bullets are 50% more accurate.",
        10: "Bullets lean toward the nearest enemy.",
        15: "Bullets swerve toward enemies and stop penetrating."
      },
      "Grenade Launcher": {
        3: "Explosions have a larger radius.",
        5: "Explosions freeze enemies in the blast.",
        10: "Explosions burn enemies in the blast.",
        15: "Explosion radius is tripled."
      }
    };

    const enemyTypes = {
      normal: { size: 32, hp: 50, speed: 85, damage: 12, reward: 5, color: "#23be46" },
      rusher: { size: 25, hp: 35, speed: 145, damage: 8, reward: 7, color: "#f5d22d" },
      tank: { size: 65, hp: 260, speed: 42, damage: 25, reward: 25, color: "#696969" },
      flame: { size: 38, hp: 90, speed: 105, damage: 18, reward: 12, color: "#f05a23" },
      ice: { size: 38, hp: 90, speed: 105, damage: 18, reward: 12, color: "#62d9f5" },
      mother: { size: 52, hp: 180, speed: 65, damage: 20, reward: 20, color: "#bd3d91" },
      merger: { size: 12, hp: 8, speed: 190, damage: 3, reward: 2, color: "#ff69b4" },

      overlord: { size: 150, hp: 5000, speed: 55, damage: 45, reward: 250, color: "#7b28a8" },
      rusherOverlord: { size: 120, hp: 3500, speed: 115, damage: 30, reward: 300, color: "#e5b829" },
      iceOverlord: { size: 130, hp: 4200, speed: 48, damage: 35, reward: 300, color: "#39b9dc" },
      flameOverlord: { size: 130, hp: 4200, speed: 70, damage: 35, reward: 300, color: "#ed5425" },
      motherOverlord: { size: 150, hp: 6000, speed: 42, damage: 35, reward: 400, color: "#bd3d91" },

      bossOverlord: { size: 170, hp: 8000, speed: 45, damage: 50, reward: 500, color: "#8b35b5" },
      rusherBossOverlord: { size: 145, hp: 6500, speed: 100, damage: 40, reward: 550, color: "#e5a91f" },
      iceBossOverlord: { size: 155, hp: 7000, speed: 42, damage: 40, reward: 550, color: "#28b9e0" },
      flameBossOverlord: { size: 155, hp: 7000, speed: 65, damage: 40, reward: 40, color: "#f04420" },
      motherBossOverlord: { size: 180, hp: 10000, speed: 38, damage: 45, reward: 750, color: "#c52d83" }
    };

    const bossWaves = {
      10: "overlord",
      20: "rusherOverlord",
      30: "iceOverlord",
      40: "flameOverlord",
      50: "motherOverlord",
      60: "bossOverlord",
      70: "rusherBossOverlord",
      80: "iceBossOverlord",
      90: "flameBossOverlord",
      100: "motherBossOverlord"
    };

    const enemyNames = {
      normal: "Basic Gloop",
      rusher: "Rusher Gloop",
      tank: "Tank of Gloops",
      flame: "Flame Gloop",
      ice: "Ice Gloop",
      mother: "Mother Gloop",
      merger: "Merger Gloop",
      overlord: "Overlord Gloop",
      rusherOverlord: "Rusher Overlord Gloop",
      iceOverlord: "Ice Overlord",
      flameOverlord: "Flame Overlord",
      motherOverlord: "Mother Overlord",
      bossOverlord: "Boss Overlord",
      rusherBossOverlord: "Rusher Boss Overlord",
      iceBossOverlord: "Ice Boss Overlord",
      flameBossOverlord: "Flame Boss Overlord",
      motherBossOverlord: "Mother Boss Overlord"
    };

    // Boss types are the values in bossWaves.
    function isOverlord(enemy) {
      return Object.values(bossWaves).includes(enemy.type);
    }

    const keys = new Set();
    const mouse = { x: W / 2, y: H / 2, buttons: [false, false] };

    let runCoins = 0;
    let player = null;
    let enemies = [];
    let bullets = [];
    let coins = [];
    let cheeses = [];
    let toxicTrails = [];
    let apocalypseTrailDamageCooldown = 0;
    let runWeapons = [];
    let weaponLevels = {};
    let wave = 1;
    let waveTimer = waveDuration;
    let enemiesRemaining = 0;
    let cooldowns = [0, 0];
    let paused = true;
    let gameover = false;
    let choosingUpgrade = false;
    let messageTimer = 0;
    let slowTimer = 0;
    let playerDamageCooldown = 0;
    let lastTime = 0;
    let runDamageBonus = 0;
    let runFireRateBonus = 0;
    let runDamageResistance = 0;

    let mergerPhase = "gathering";
    let previewWaveNumber = 0;
    let previewEnemies = [];
    let activeWaveEnemies = [];

    function markEnemyDefeatedForWave(enemy) {
      if (enemy.countedAsDefeated) return;
      enemy.countedAsDefeated = true;
      enemiesRemaining = Math.max(0, enemiesRemaining - 1);
    }

    function getHypnotizedCount() {
      return enemies.reduce(

        function makeWavePreview(waveNumber) {
      const bossType = bossWaves[waveNumber];

      if (bossType) {
        return [{ type: bossType, count: 1 }];
      }

      const counts = {
        normal: 0,
        rusher: 0,
        flame: 0,
        ice: 0,
        tank: 0,
        merger: 0
      };

      const total = 5 + waveNumber * 2;

      for (let i = 0; i < total; i++) {
        const roll = Math.random();
        let type = "normal";

        if (waveNumber >= 3 && roll < 0.35) {
          type = "merger";
        } else if (waveNumber >= 6 && roll < 0.45) {
          type = "tank";
        } else if (waveNumber >= 3 && roll < 0.65) {
          type = "ice";
        } else if (waveNumber >= 3 && roll < 0.80) {
          type = "flame";
        } else if (roll < 0.90) {
          type = "rusher";
        }

        counts[type]++;
      }

      return Object.keys(counts)
        .filter(type => counts[type] > 0)
        .map(type => ({
          type,
          count: type === "merger" ? counts[type] * 3 : counts[type]
        }));
    }

    function prepareNextWavePreview() {
      previewWaveNumber = wave + 1;
      previewEnemies = makeWavePreview(previewWaveNumber);
    }

    function updateWavePreview() {
      if (!player || gameover) {
        previewElement.innerHTML = "";
        return;
      }

      const countdown = choosingUpgrade
        ? "starts after shop"
        : `starts in ${Math.ceil(waveTimer)} sec`;

      previewElement.innerHTML = `
        <h3>Next wave: ${previewWaveNumber} — ${countdown}</h3>
        ${previewEnemies.map(enemy => `
          <div class="preview-enemy">
            <span class="gloop-icon"
                  style="background:${enemyTypes[enemy.type].color}"></span>
            <span>${escapeHtml(selectedMode === "Apocalypse" && enemy.type === "normal" ? "Corrupted Gloop" : enemyNames[enemy.type])} × ${enemy.count}</span>
          </div>
        `).join("")}
      `;
    }

    function spawn(kind, x, y) {
      const type = enemyTypes[kind];
      if (!type) return null;

      if (x === undefined || y === undefined) {
        const side = Math.floor(Math.random() * 4);
        x = bounds.left + Math.random() * (bounds.right - bounds.left);
        y = bounds.top + Math.random() * (bounds.bottom - bounds.top);

        if (side === 0) y = bounds.top;
        else if (side === 1) y = bounds.bottom;
        else if (side === 2) x = bounds.left;
        else x = bounds.right;
      }

      const enemy = {
        type: kind,
        x, y,
        hp: type.hp,
        maxHp: type.hp,
        speed: type.speed,
        size: type.size,
        damage: type.damage,
        reward: type.reward,
        mergedCount: 1,
        hitCooldown: 0,
        burnCooldown: 0,
        burnTimer: 0,
        burnTick: 0,
        frozenTimer: 0,
        hypnotized: false,
        countedAsDefeated: false,
        attackTarget: null,
        facingAngle: 0,
        summonCooldown: 3,
        dashCooldown: 2.5,
        dashTime: 0,
        dashVx: 0,
        dashVy: 0,
        // Only basic Gloops are corrupted in Apocalypse Mode.
        isCorrupted: selectedMode === "Apocalypse" && kind === "normal",
        trailTimer: 0.15 + Math.random() * 0.2
      };

      enemies.push(enemy);
      return enemy;
    }

    function getBossNumber(waveNumber) {
      return Math.floor(waveNumber / 10);
    }

    function scaleEnemyForWave(enemy, waveNumber) {
      if (isOverlord(enemy)) {
        const bossNumber = getBossNumber(waveNumber);
        const healthMultiplier = getBossHealthPercent(bossNumber) / 100;

        enemy.maxHp = Math.round(enemy.maxHp * healthMultiplier);
        enemy.hp = enemy.maxHp;
        return;
      }

      const completedBossWaves = Math.floor((waveNumber - 1) / 10);
      const multiplier = Math.pow(1.5, completedBossWaves);

      enemy.maxHp = Math.round(enemy.maxHp * multiplier);
      enemy.hp = enemy.maxHp;
      enemy.damage = Math.round(enemy.damage * multiplier);
    }

    function mergerHealthForSize(size) {
      return enemyTypes.merger.hp *
        Math.pow(size / enemyTypes.merger.size, 2);
    }

    function mergerSpeedForHealth(maxHp) {
      const baseSpeed = enemyTypes.normal.speed;
      const maxSpeed = enemyTypes.rusher.speed;
      const healthRatio = Math.max(1, maxHp / enemyTypes.merger.hp);

      return Math.min(
        maxSpeed,
        baseSpeed + baseSpeed * (Math.sqrt(healthRatio) - 1) / 27
      );
    }

    function updateMergerHealth(first, second) {
      const firstHealthPercent = first.hp / first.maxHp;
      const secondHealthPercent = second.hp / second.maxHp;
      const completedBossWaves = Math.floor((wave - 1) / 10);
      const waveMultiplier = Math.pow(1.5, completedBossWaves);

      first.maxHp = Math.round(mergerHealthForSize(first.size) * waveMultiplier);
      first.hp = Math.max(
        1,
        Math.round(first.maxHp * Math.min(1, firstHealthPercent + secondHealthPercent))
      );
      first.speed = mergerSpeedForHealth(first.maxHp);
    }

    function startWave() {
      messageTimer = 2;
      waveTimer = waveDuration;
      mergerPhase = "gathering";
      activeWaveEnemies = previewEnemies.map(enemy => ({ ...enemy }));
      wave = previewWaveNumber;
      enemiesRemaining = enemies.filter(enemy => !enemy.hypnotized).length;

      for (const group of activeWaveEnemies) {
        for (let i = 0; i < group.count; i++) {
          const enemy = spawn(group.type);
          if (!enemy) continue;

          scaleEnemyForWave(enemy, wave);
          enemiesRemaining++;
        }
      }

      prepareNextWavePreview();
    }

    function resetGame() {
      runCoins = 0;
      enemies = [];
      bullets = [];
      coins = [];
      cheeses = [];
      toxicTrails = [];
      apocalypseTrailDamageCooldown = 0;
      wave = 1;
      waveTimer = waveDuration;
      enemiesRemaining = 0;
      cooldowns = [0, 0];
      gameover = false;
      choosingUpgrade = false;
      paused = false;
      slowTimer = 0;
      playerDamageCooldown = 0;
      mergerPhase = "gathering";

      runWeapons = ["Pistol"];
      weaponLevels = { Pistol: 1 };
      runDamageBonus = 0;
      runFireRateBonus = 0;
      runDamageResistance = 0;

      player = {
        x: (bounds.left + bounds.right) / 2,
        y: (bounds.top + bounds.bottom) / 2,
        size: 28,
        speed: 260,
        hp: 120,
        maxHp: 120
      };

      previewWaveNumber = 1;
      previewEnemies = makeWavePreview(1);
      hideOverlay();
      startWave();
    }

    function getWeaponStats(name) {
      const base = weapons[name];
      const level = weaponLevels[name] || 1;
      const upgradeSteps = level - 1;

      return {
        ...base,
        damage: base.damage * (1 + upgradeSteps * 0.3),
        cooldown: base.cooldown / (1 + upgradeSteps * 0.15)
      };
    }

    function weaponUpgradeCost(name) {
      return 30 * (weaponLevels[name] || 1);
    }

    function getWeaponUpgradeDescription(name, level) {
      const milestones = weaponMilestones[name] || {};
      const nextMilestone = Object.keys(milestones)
        .map(Number)
        .find(milestone => milestone > level);

      return nextMilestone
        ? `Increase damage and fire rate. Level ${nextMilestone}: ${milestones[nextMilestone]}`
        : "Increase this weapon's damage and fire rate.";
    }

    function updateEquippedSlots(slot1, slot2) {
      const first = slot1.value;
      let second = slot2.value;

      if (second && second === first) {
        second = "";
        slot2.value = "";
      }

      const equipped = [first, ...(second ? [second] : [])];
      const unequipped = runWeapons.filter(name => !equipped.includes(name));
      runWeapons = [...equipped, ...unequipped];
    }

    function buyGun(name) {
      if (!weapons[name] || runWeapons.includes(name)) return false;

      const cost = gunPrices[name];
      if (runCoins < cost) return false;

      runCoins -= cost;
      runWeapons.push(name);
      weaponLevels[name] = 1;
      return true;
    }

    function openUpgradeShop(clearedWave) {
      paused = true;
      choosingUpgrade = true;
      renderUpgradeShop("", clearedWave);
    }

    function renderUpgradeShop(status = "", shopWave = wave) {
      const canBuyGuns = shopWave % 10 === 0;

      const upgrades = [
        {
          id: "weapon-damage",
          title: "All Weapon Damage",
          description: `Current bonus: +${Math.round(runDamageBonus * 100)}% damage`,
          cost: 40 * (Math.round(runDamageBonus / 0.25) + 1) + 50,
          action() { runDamageBonus += 0.25; }
        },
        {
          id: "fire-rate",
          title: "Fire Rate",
          description: `Current bonus: +${Math.round(runFireRateBonus * 100)}% fire rate`,
          cost: 35 * (Math.round(runFireRateBonus / 0.25) + 1) + 50,
          action() { runFireRateBonus += 0.25; }
        },
        {
          id: "damage-resistance",
          title: "Damage Resistance",
          description: `Current resistance: ${Math.round(runDamageResistance * 100)}%`,
          cost: 50 * (Math.round(runDamageResistance / 0.10) + 1) + 50,
          action() {
            runDamageResistance = Math.min(0.75, runDamageResistance + 0.10);
          }
        },
        {
          id: "health",
          title: "Max Health",
          description: `Current max health: ${player.maxHp}`,
          cost: 30 * Math.max(1, Math.round((player.maxHp - 120) / 20) + 1) + 50,
          action() {
            player.maxHp += 20;
            player.hp = Math.min(player.maxHp, player.hp + 20);
          }
        },
        {
          id: "heal",
          title: "Heal 40 Health",
          description: `Restore up to 40 health (current: ${Math.ceil(player.hp)}/${player.maxHp})`,
          cost: 75,
          action() { player.hp = Math.min(player.maxHp, player.hp + 40); }
        },
        {
          id: "speed",
          title: "Movement Speed",
          description: `Current speed: ${Math.round(player.speed)}`,
          cost: 35 * Math.max(1, Math.round((player.speed - 260) / 35) + 1) + 50,
          action() { player.speed += 35; }
        }
      ];

      for (const name of runWeapons) {
        const level = weaponLevels[name] || 1;

        upgrades.push({
          id: `weapon-${name}`,
          title: `Upgrade ${name} (Level ${level})`,
          description: getWeaponUpgradeDescription(name, level),
          cost: weaponUpgradeCost(name) + 50,
          action() { weaponLevels[name] = level + 1; }
        });
      }

      if (canBuyGuns) {
        for (const [name, cost] of Object.entries(gunPrices)) {
          if (runWeapons.includes(name)) continue;

          upgrades.push({
            id: `buy-gun-${name}`,
            title: `Buy ${name}`,
            description: "Add this gun to your inventory and equip it in a weapon slot.",
            cost,
            isGunPurchase: true,
            action() { return buyGun(name); }
          });
        }
      }

      showOverlay(`
        <h1>WAVE ${shopWave} CLEARED — UPGRADES</h1>
        <p>Spend this run's coins here. Coins reset when you start a new run.</p>
        <p><strong>Coins: ${runCoins}</strong><br>
        ${canBuyGuns ? "Gun purchases are available this shop." : "New guns are available every 10 waves."}</p>
        <p id="upgrade-status">${escapeHtml(status)}</p>

        <div class="shop-layout">
          <aside class="inventory">
            <h2>Gun Inventory</h2>
            <p>Choose which owned guns to equip.</p>

            <label for="slot-1"><strong>Slot 1</strong></label>
            <select id="slot-1">
              ${runWeapons.map((name, index) => `
                <option value="${escapeHtml(name)}" ${index === 0 ? "selected" : ""}>
                  ${escapeHtml(name)}
                </option>
              `).join("")}
            </select>

            <label for="slot-2"><strong>Slot 2</strong></label>
            <select id="slot-2">
              <option value="">None</option>
              ${runWeapons.map((name, index) => `
                <option value="${escapeHtml(name)}" ${index === 1 ? "selected" : ""}>
                  ${escapeHtml(name)}
                </option>
              `).join("")}
            </select>

            <h3>Owned Guns</h3>
            <ul>
              ${runWeapons.map(name => `
                <li>${escapeHtml(name)} — Level ${weaponLevels[name] || 1}
                  ${runWeapons[0] === name ? " (Slot 1)" : ""}
                  ${runWeapons[1] === name ? " (Slot 2)" : ""}
                </li>
              `).join("")}
            </ul>
          </aside>

          <section class="upgrade-list">
            ${upgrades.map(item => `
              <div class="upgrade-card">
                <h2>${escapeHtml(item.title)}</h2>
                <p>${escapeHtml(item.description)}</p>
                <button data-upgrade="${escapeHtml(item.id)}"
                  ${runCoins < item.cost ||
                    (item.id === "damage-resistance" && runDamageResistance >= 0.75)
                    ? "disabled" : ""}>
                  ${item.isGunPurchase ? "" : "Buy — "}${item.cost} coins
                </button>
              </div>
            `).join("")}
          </section>
        </div>

        <div class="actions">
          <button id="continue-button">CONTINUE TO WAVE ${wave + 1}</button>
        </div>
      `);

      const slot1 = panel.querySelector("#slot-1");
      const slot2 = panel.querySelector("#slot-2");

      slot1.onchange = () => {
        updateEquippedSlots(slot1, slot2);
        renderUpgradeShop(status, shopWave);
      };

      slot2.onchange = () => {
        updateEquippedSlots(slot1, slot2);
        renderUpgradeShop(status, shopWave);
      };

      panel.querySelectorAll("[data-upgrade]").forEach(button => {
        button.onclick = () => {
          const item = upgrades.find(upgrade => upgrade.id === button.dataset.upgrade);
          if (!item || runCoins < item.cost) return;
          if (item.id === "damage-resistance" && runDamageResistance >= 0.75) return;

          updateEquippedSlots(slot1, slot2);

          // Gun purchases deduct their price inside buyGun(). Do not deduct it
          // again here, or the player can lose coins without receiving the gun.
          if (item.isGunPurchase) {
            const purchased = item.action();
            if (!purchased) {
              renderUpgradeShop(`Could not buy ${item.title.replace(/^Buy /, "")}. Check your coins and inventory.`, shopWave);
              return;
            }
            renderUpgradeShop(`${item.title} purchased.`, shopWave);
            return;
          }

          runCoins -= item.cost;
          item.action();
          renderUpgradeShop(`${item.title} purchased.`, shopWave);
        };
      });

      panel.querySelector("#continue-button").onclick = () => {
        updateEquippedSlots(slot1, slot2);
        choosingUpgrade = false;
        paused = false;
        hideOverlay();
        startWave();
      };
    }
    function getMilestoneLevel(name, milestone) {
      return (weaponLevels[name] || 1) >= milestone;
    }

    function getExplosionRadius(name) {
      if (name === "Grenade Launcher") {
        return getMilestoneLevel(name, 15) ? 255 :
          getMilestoneLevel(name, 3) ? 110 : 85;
      }

      if (
        (name === "Pistol" || name === "Shotgun") &&
        getMilestoneLevel(name, 5)
      ) {
        return 42.5;
      }

      return 0;
    }

    function nearestEnemy(x, y, exclude = null, hypnotized = false) {
      let nearest = null;
      let nearestDistance = Infinity;

      for (const enemy of enemies) {
        if (enemy === exclude || enemy.hypnotized !== hypnotized) continue;

        const distance = Math.hypot(enemy.x - x, enemy.y - y);
        if (distance < nearestDistance) {
          nearest = enemy;
          nearestDistance = distance;
        }
      }

      return nearest;
    }

    function hypnotizeEnemy(enemy) {
      if (enemy.hypnotized || getHypnotizedCount() >= MAX_HYPNOTIZED_ENEMIES) {
        return false;
      }

      enemy.hypnotized = true;
      enemy.burnTimer = 0;
      enemy.frozenTimer = 0;
      markEnemyDefeatedForWave(enemy);

      for (const bullet of bullets) {
        bullet.hitEnemies?.add(enemy);
      }

      return true;
    }

    function applyBurn(enemy, duration) {
      if (!enemy.hypnotized) {
        enemy.burnTimer = Math.max(enemy.burnTimer || 0, duration);
      }
    }

    function applyExplosion(bullet) {
      const radius = getExplosionRadius(bullet.weapon);
      if (!radius) return;

      const level = weaponLevels[bullet.weapon] || 1;
      const burns = level >= 10;
      const freezes = bullet.weapon === "Grenade Launcher" && level >= 5;

      for (const enemy of [...enemies]) {
        if (enemy.hypnotized) continue;
        if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) > radius) continue;

        enemy.hp -= bullet.damage * 0.55;

        if (burns) applyBurn(enemy, BURN_DURATION);
        if (freezes) {
          enemy.frozenTimer = Math.max(enemy.frozenTimer || 0, FREEZE_DURATION);
        }

        if (enemy.hp <= 0) killEnemy(enemy);
      }
    }

    function fire(slot) {
      const name = runWeapons[slot];
      if (!player || !name || !weapons[name]) return;

      const weapon = getWeaponStats(name);
      cooldowns[slot] = weapon.cooldown / (1 + runFireRateBonus);

      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      const level = weaponLevels[name] || 1;

      for (let i = 0; i < weapon.pellets; i++) {
        let spread = weapon.spread;
        if (name === "AK-47" && level >= 5) spread *= 0.5;

        const shotAngle = angle + (Math.random() * 2 - 1) * spread;

        bullets.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(shotAngle) * weapon.speed,
          vy: Math.sin(shotAngle) * weapon.speed,
          damage: weapon.damage * (1 + runDamageBonus),
          life: 2.5,
          weapon: name,
          penetrationsLeft:
            name === "Sniper"
              ? level >= 5 ? 5 : level >= 3 ? 2 : 0
              : name === "AK-47" && level >= 3 && level < 15 ? 1 : 0,
          hitEnemies: new Set(),
          explosive: getExplosionRadius(name) > 0,
          homingStrength:
            name === "AK-47" && level >= 15 ? 7 :
            name === "AK-47" && level >= 10 ? 2.5 : 0
        });
      }
    }

    function killEnemy(enemy) {
      const index = enemies.indexOf(enemy);
      if (index === -1) return;

      enemies.splice(index, 1);

      if (!enemy.hypnotized && !enemy.countedAsDefeated) {
        markEnemyDefeatedForWave(enemy);
      }

      const dropAmount = enemy.type === "merger"
        ? (enemy.mergedCount || 1) + 1
        : enemy.reward;

      coins.push({ x: enemy.x, y: enemy.y, value: dropAmount, life: 20 });

      if (Math.random() < 0.05) {
        cheeses.push({ x: enemy.x, y: enemy.y, life: 18 });
      }

      if (enemy.type === "tank") {
        for (let i = 0; i < 3; i++) {
          const child = spawn(
            "normal",
            enemy.x + Math.random() * 70 - 35,
            enemy.y + Math.random() * 70 - 35
          );

          if (child) {
            scaleEnemyForWave(child, wave);
            enemiesRemaining++;
          }
        }
      }

      if (enemy.type === "motherBossOverlord") {
        for (let i = 0; i < 3; i++) {
          const child = spawn(
            "overlord",
            enemy.x + Math.random() * 100 - 50,
            enemy.y + Math.random() * 100 - 50
          );

          if (child) {
            scaleEnemyForWave(child, wave);
            enemiesRemaining++;
          }
        }
      }

      if (enemy.type === "merger") {
        const mergerCount = enemies.filter(item => item.type === "merger").length;
        mergerPhase = mergerCount === 1 ? "hunting" : "gathering";
      }
    }

    function mergeTouchingMergers() {
      const mergers = enemies.filter(enemy => enemy.type === "merger");

      for (let i = 0; i < mergers.length; i++) {
        const first = mergers[i];
        if (!enemies.includes(first)) continue;

        for (let j = i + 1; j < mergers.length; j++) {
          const second = mergers[j];
          if (!enemies.includes(second)) continue;

          const touchDistance = (first.size + second.size) / 2;
          if (Math.hypot(first.x - second.x, first.y - second.y) > touchDistance) {
            continue;
          }

          first.damage += second.damage;
          first.reward += second.reward;
          first.mergedCount += second.mergedCount || 1;
          first.size = Math.min(220, Math.sqrt(first.size ** 2 + second.size ** 2));
          first.x = (first.x + second.x) / 2;
          first.y = (first.y + second.y) / 2;

          updateMergerHealth(first, second);

          enemies.splice(enemies.indexOf(second), 1);
          if (!second.countedAsDefeated) markEnemyDefeatedForWave(second);

          j = i;
        }
      }

      const remaining = enemies.filter(enemy => enemy.type === "merger").length;
      if (remaining === 1) mergerPhase = "hunting";
      else if (remaining > 1) mergerPhase = "gathering";
    }

    function summonFromOverlord(enemy) {
      const summonTypes = {
        bossOverlord: "normal",
        rusherBossOverlord: "rusher",
        iceBossOverlord: "ice",
        flameBossOverlord: "flame",
        motherBossOverlord: "mother"
      };

      const kind = summonTypes[enemy.type];
      if (!kind) return;

      const angle = Math.random() * Math.PI * 2;
      const distance = enemy.size / 2 + 28;
      const x = Math.max(bounds.left + 20, Math.min(bounds.right - 20,
        enemy.x + Math.cos(angle) * distance));
      const y = Math.max(bounds.top + 20, Math.min(bounds.bottom - 20,
        enemy.y + Math.sin(angle) * distance));

      const summoned = spawn(kind, x, y);
      if (summoned) {
        scaleEnemyForWave(summoned, wave);
        enemiesRemaining++;
      }
    }

    function endGame() {
      if (gameover) return;

      gameover = true;
      paused = true;
      choosingUpgrade = false;

      showOverlay(`
        <h1 style="color:#dc4137">RUN OVER</h1>
        <p>Mode: <strong>${escapeHtml(selectedMode)}</strong></p>
        <p>Coins collected this run: <strong>${runCoins}</strong></p>
        <p>Coins reset when you start a new run.</p>
        <div class="actions">
          <button id="restart-button">RESTART</button>
          <button id="home-button">HOME</button>
        </div>
      `);

      panel.querySelector("#restart-button").onclick = resetGame;
      panel.querySelector("#home-button").onclick = () => {
        runCoins = 0;
        player = null;
        showHomeScreen();
      };
      const scoreStatus = document.createElement("p");
      scoreStatus.id = "score-submit-status";
      scoreStatus.setAttribute("role", "status");
      panel.appendChild(scoreStatus);
      submitRunScore();
    }

    function updateBulletHoming(bullet, dt) {
      if (!bullet.homingStrength) return;

      const target = nearestEnemy(bullet.x, bullet.y);
      if (!target) return;

      const speed = Math.hypot(bullet.vx, bullet.vy);
      const angle = Math.atan2(bullet.vy, bullet.vx);
      const targetAngle = Math.atan2(target.y - bullet.y, target.x - bullet.x);

      let difference = targetAngle - angle;
      while (difference > Math.PI) difference -= Math.PI * 2;
      while (difference < -Math.PI) difference += Math.PI * 2;

      const turn = Math.max(
        -bullet.homingStrength * dt,
        Math.min(bullet.homingStrength * dt, difference)
      );

      const newAngle = angle + turn;
      bullet.vx = Math.cos(newAngle) * speed;
      bullet.vy = Math.sin(newAngle) * speed;
    }

    function finishWave() {
      if (gameover || choosingUpgrade || !player) return;

      const clearedWave = wave;
      if (clearedWave % 5 === 0) openUpgradeShop(clearedWave);
      else startWave();
    }

    function takePlayerDamage(amount) {
      player.hp -= amount * (1 - runDamageResistance);
    }

    function update(dt) {
      if (paused || gameover || choosingUpgrade || !player) return;

      waveTimer = Math.max(0, waveTimer - dt);
      slowTimer = Math.max(0, slowTimer - dt);
      playerDamageCooldown = Math.max(0, playerDamageCooldown - dt);
      apocalypseTrailDamageCooldown = Math.max(0, apocalypseTrailDamageCooldown - dt);
      for (const trail of [...toxicTrails]) {
        trail.life -= dt;
        if (trail.life <= 0) toxicTrails.splice(toxicTrails.indexOf(trail), 1);
      }

      const horizontal =
        Number(keys.has("d") || keys.has("ArrowRight")) -
        Number(keys.has("a") || keys.has("ArrowLeft"));
      const vertical =
        Number(keys.has("s") || keys.has("ArrowDown")) -
        Number(keys.has("w") || keys.has("ArrowUp"));

      if (horizontal || vertical) {
        const length = Math.hypot(horizontal, vertical);
        const slow = slowTimer > 0 ? 0.5 : 1;

        player.x += horizontal / length * player.speed * slow * dt;
        player.y += vertical / length * player.speed * slow * dt;
      }

      const playerHalf = player.size / 2;
      player.x = Math.max(bounds.left + playerHalf,
        Math.min(bounds.right - playerHalf, player.x));
      player.y = Math.max(bounds.top + playerHalf,
        Math.min(bounds.bottom - playerHalf, player.y));

      for (let slot = 0; slot < 2; slot++) {
        cooldowns[slot] = Math.max(0, cooldowns[slot] - dt);
        if (runWeapons[slot] && mouse.buttons[slot] && cooldowns[slot] <= 0) {
          fire(slot);
        }
      }

      for (const bullet of [...bullets]) {
        updateBulletHoming(bullet, dt);
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;

        let removeBullet = false;

        for (const enemy of [...enemies]) {
          if (bullet.hitEnemies.has(enemy)) continue;

          if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) > enemy.size / 2) {
            continue;
          }

          bullet.hitEnemies.add(enemy);
          if (enemy.hypnotized) continue;

          enemy.hp -= bullet.damage;
          const level = weaponLevels[bullet.weapon] || 1;

          if (["Pistol", "Shotgun"].includes(bullet.weapon) && level >= 3) {
            applyBurn(enemy, BURN_DURATION);
          }

          if (bullet.weapon === "Sniper" && level >= 10) {
            applyBurn(enemy, SNIPER_BURN_DURATION);
          }

          if (
            ["Pistol", "Shotgun", "Sniper"].includes(bullet.weapon) &&
            level >= 15
          ) {
            hypnotizeEnemy(enemy);
          }

          if (bullet.explosive) {
            applyExplosion(bullet);
            removeBullet = true;
          } else if (bullet.penetrationsLeft > 0) {
            bullet.penetrationsLeft--;
          } else {
            removeBullet = true;
          }

          if (enemy.hp <= 0) killEnemy(enemy);
          if (removeBullet) break;
        }

        const outside =
          bullet.x < bounds.left - 150 || bullet.x > bounds.right + 150 ||
          bullet.y < bounds.top - 150 || bullet.y > bounds.bottom + 150;

        if (removeBullet || bullet.life <= 0 || outside) {
          const index = bullets.indexOf(bullet);
          if (index !== -1) bullets.splice(index, 1);
        }
      }

      for (const enemy of [...enemies]) {
        enemy.hitCooldown = Math.max(0, enemy.hitCooldown - dt);
        enemy.burnCooldown = Math.max(0, enemy.burnCooldown - dt);
        enemy.frozenTimer = Math.max(0, (enemy.frozenTimer || 0) - dt);

        if (!enemy.hypnotized && enemy.burnTimer > 0) {
          enemy.burnTimer = Math.max(0, enemy.burnTimer - dt);
          enemy.burnTick = (enemy.burnTick || 0) - dt;

          if (enemy.burnTick <= 0) {
            enemy.hp -= 5;
            enemy.burnTick = 0.5;

            if (enemy.hp <= 0) {
              killEnemy(enemy);
              continue;
            }
          }
        }

        const target = enemy.hypnotized
          ? nearestEnemy(enemy.x, enemy.y, enemy, false)
          : nearestEnemy(enemy.x, enemy.y, enemy, true);

        enemy.attackTarget = target;

        if (target) {
          const tx = target.x - enemy.x;
          const ty = target.y - enemy.y;
          const distanceToTarget = Math.max(1, Math.hypot(tx, ty));

          if (enemy.type === "tank") {
            enemy.facingAngle = Math.atan2(ty, tx);
          }

          if (distanceToTarget > (enemy.size + target.size) / 2) {
            const speed = enemy.frozenTimer > 0 ? 0 : enemy.speed;
            enemy.x += tx / distanceToTarget * speed * dt;
            enemy.y += ty / distanceToTarget * speed * dt;
          } else if (enemy.hitCooldown <= 0) {
            target.hp -= enemy.damage;
            enemy.hitCooldown = 0.65;
            if (target.hp <= 0) killEnemy(target);
          }

          continue;
        }

        if (enemy.hypnotized) continue;

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const distance = Math.max(1, Math.hypot(dx, dy));

        if (enemy.type === "tank") {
          enemy.facingAngle = Math.atan2(dy, dx);
        }

        if (isOverlord(enemy)) {
          enemy.dashCooldown -= dt;

          if (enemy.dashTime > 0) {
            enemy.dashTime -= dt;
            enemy.x += enemy.dashVx * dt;
            enemy.y += enemy.dashVy * dt;
          } else {
            const speed = enemy.frozenTimer > 0 ? 0 : enemy.speed;
            enemy.x += dx / distance * speed * dt;
            enemy.y += dy / distance * speed * dt;

            if (enemy.dashCooldown <= 0 && distance > 100) {
              enemy.dashVx = dx / distance * 650;
              enemy.dashVy = dy / distance * 650;
              enemy.dashTime = 0.55;
              enemy.dashCooldown = 3.5;
            }
          }

          const bossHalf = enemy.size / 2;
          enemy.x = Math.max(bounds.left + bossHalf,
            Math.min(bounds.right - bossHalf, enemy.x));
          enemy.y = Math.max(bounds.top + bossHalf,
            Math.min(bounds.bottom - bossHalf, enemy.y));

          const summoningBosses = [
            "bossOverlord",
            "rusherBossOverlord",
            "iceBossOverlord",
            "flameBossOverlord",
            "motherBossOverlord"
          ];

          if (summoningBosses.includes(enemy.type)) {
            enemy.summonCooldown -= dt;

            if (enemy.summonCooldown <= 0) {
              summonFromOverlord(enemy);
              enemy.summonCooldown =
                enemy.type === "motherBossOverlord" ? 1.5 : 2.5;
            }
          }
        } else if (enemy.type === "merger" && mergerPhase === "gathering") {
          const dxCenter = mergerCenter.x - enemy.x;
          const dyCenter = mergerCenter.y - enemy.y;
          const centerDistance = Math.max(1, Math.hypot(dxCenter, dyCenter));
          const speed = enemy.frozenTimer > 0 ? 0 : enemyTypes.rusher.speed;

          enemy.x += dxCenter / centerDistance * speed * dt;
          enemy.y += dyCenter / centerDistance * speed * dt;
        } else {
          const speed = enemy.frozenTimer > 0
            ? 0
            : enemy.type === "merger"
              ? mergerSpeedForHealth(enemy.maxHp)
              : enemy.speed;

          enemy.x += dx / distance * speed * dt;
          enemy.y += dy / distance * speed * dt;
        }

        // In Apocalypse Mode, corrupted basic Gloops periodically leave damaging trails.
        if (selectedMode === "Apocalypse" && enemy.isCorrupted) {
          enemy.trailTimer -= dt;
          if (enemy.trailTimer <= 0) {
            toxicTrails.push({ x: enemy.x, y: enemy.y, life: 1.75, maxLife: 1.75 });
            enemy.trailTimer = 0.32;
          }
        }

        const playerRadius = player.size / 2 * PLAYER_HITBOX_SCALE;
        const enemyRadius = enemy.size / 2 * ENEMY_HITBOX_SCALE;
        const playerDistance = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        const touching = playerDistance <= playerRadius + enemyRadius;

        if (
          enemy.type === "flame" &&
          playerDistance <= FLAME_RANGE &&
          enemy.burnCooldown <= 0 &&
          playerDamageCooldown <= 0
        ) {
          takePlayerDamage(FLAME_DAMAGE);
          enemy.burnCooldown = FLAME_COOLDOWN;
          playerDamageCooldown = 0.45;
        }

        const mergerCanAttack =
          enemy.type !== "merger" || mergerPhase === "hunting";

        if (
          touching &&
          mergerCanAttack &&
          enemy.hitCooldown <= 0 &&
          playerDamageCooldown <= 0
        ) {
          takePlayerDamage(enemy.damage);
          enemy.hitCooldown = isOverlord(enemy) ? 0.8 : 0.65;
          playerDamageCooldown = 0.45;

          if (enemy.type === "ice") slowTimer = FREEZE_DURATION;
        }
      }

      if (selectedMode === "Apocalypse" && apocalypseTrailDamageCooldown <= 0) {
        const standingInToxicTrail = toxicTrails.some(trail =>
          Math.hypot(player.x - trail.x, player.y - trail.y) < player.size / 2 + 10
        );
        if (standingInToxicTrail) {
          takePlayerDamage(3);
          apocalypseTrailDamageCooldown = 0.5;
        }
      }

      mergeTouchingMergers();

      for (const coin of [...coins]) {
        coin.life -= dt;

        if (Math.hypot(player.x - coin.x, player.y - coin.y) < player.size / 2 + 14) {
          runCoins += coin.value;
          coins.splice(coins.indexOf(coin), 1);
        } else if (coin.life <= 0) {
          coins.splice(coins.indexOf(coin), 1);
        }
      }

      for (const cheese of [...cheeses]) {
        cheese.life -= dt;

        if (Math.hypot(player.x - cheese.x, player.y - cheese.y) < player.size / 2 + 14) {
          const healingAmount = selectedMode === "Apocalypse" ? 50 : 30;
          player.hp = Math.min(player.maxHp, player.hp + healingAmount);
          cheeses.splice(cheeses.indexOf(cheese), 1);
        } else if (cheese.life <= 0) {
          cheeses.splice(cheeses.indexOf(cheese), 1);
        }
      }

      if (player.hp <= 0) {
        player.hp = 0;
        endGame();
        return;
      }

      enemiesRemaining = enemies.filter(enemy => !enemy.hypnotized).length;

      if (waveTimer <= 0 || enemiesRemaining === 0) {
        finishWave();
        return;
      }

      messageTimer = Math.max(0, messageTimer - dt);
    }

    function drawText(value, x, y, color = "#f5f5f5", size = 22, align = "left") {
      ctx.fillStyle = color;
      ctx.font = `${size}px Arial`;
      ctx.textAlign = align;
      ctx.fillText(value, x, y);
      ctx.textAlign = "left";
    }

    function drawFlameGlow(enemy, bodyRadius) {
      const pulse = 1 + Math.sin(performance.now() / 130) * 0.035;
      const glowRadius = FLAME_RANGE * pulse;
      const gradient = ctx.createRadialGradient(
        enemy.x, enemy.y, bodyRadius,
        enemy.x, enemy.y, glowRadius
      );

      gradient.addColorStop(0, "rgba(255,75,12,.58)");
      gradient.addColorStop(.42, "rgba(255,125,18,.34)");
      gradient.addColorStop(.78, "rgba(255,190,30,.16)");
      gradient.addColorStop(1, "rgba(255,190,30,0)");

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, glowRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTank(enemy, color) {
      const size = enemy.size * 0.85;

      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.facingAngle || 0);

      ctx.fillStyle = color;
      ctx.strokeStyle = enemy.hypnotized ? "#f5d741" : "#141914";
      ctx.lineWidth = 3;
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.strokeRect(-size / 2, -size / 2, size, size);

      const side = size * 0.48;
      const height = side * Math.sqrt(3) / 2;

      ctx.beginPath();
      ctx.moveTo(height * 2 / 3, 0);
      ctx.lineTo(-height / 3, -side / 2);
      ctx.lineTo(-height / 3, side / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const barrelLength = size * 0.48;
      const barrelThickness = size * 0.22;
      const barrelStart = height * 0.55;

      ctx.fillRect(barrelStart, -barrelThickness / 2, barrelLength, barrelThickness);
      ctx.strokeRect(barrelStart, -barrelThickness / 2, barrelLength, barrelThickness);
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = selectedMode === "Apocalypse" ? "#252033" : "#5c9b41";
      ctx.fillRect(0, 0, W, H);
      if (selectedMode === "Apocalypse") {
        // Subtle toxic patches give the special mode a different atmosphere.
        ctx.save();
        ctx.globalAlpha = 0.24;
        for (let i = 0; i < 9; i++) {
          const px = 70 + ((i * 137) % (W - 140));
          const py = 100 + ((i * 83) % (H - 150));
          ctx.fillStyle = i % 2 ? "#71358c" : "#78d936";
          ctx.beginPath();
          ctx.ellipse(px, py, 22 + (i % 3) * 7, 10 + (i % 4) * 3, i * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.fillStyle = "#141914";
      ctx.fillRect(0, 0, W, 58);
      ctx.strokeStyle = "#141914";
      ctx.lineWidth = 3;
      ctx.strokeRect(
        bounds.left,
        bounds.top,
        bounds.right - bounds.left,
        bounds.bottom - bounds.top
      );

      drawText("GLOOP SURVIVAL", 18, 37, "#f5d741");

      if (player) {
        drawText(`Mode: ${selectedMode}`, 250, 37, selectedMode === "Apocalypse" ? "#c879ff" : "#ffe978", 16);
        if (selectedMode === "Apocalypse") {
          drawText("SEASON 1", 250, 53, "#a9ff62", 11);
        }
        drawText(`Wave: ${wave}`, 390, 37);
        drawText(`Time: ${Math.ceil(waveTimer)}s`, 465, 37, "#ffe978");
        drawText(`Coins: ${runCoins}`, 570, 37, "#f5d741");

        ctx.fillStyle = "#351b1b";
        ctx.fillRect(700, 17, 280, 18);
        ctx.fillStyle = "#dc4137";
        ctx.fillRect(700, 17, 280 * Math.max(0, player.hp / player.maxHp), 18);
        ctx.strokeStyle = "#f5f5f5";
        ctx.strokeRect(700, 17, 280, 18);

        drawText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`,
          700, 53, "#f5f5f5", 14);

        if (runDamageResistance > 0) {
          drawText(
            `Resistance: ${Math.round(runDamageResistance * 100)}%`,
            980, 53, "#ffe978", 14, "right"
          );
        }
      }

      for (const trail of toxicTrails) {
        const fade = Math.max(0, Math.min(1, trail.life / trail.maxLife));
        ctx.save();
        ctx.globalAlpha = 0.18 + fade * 0.35;
        ctx.fillStyle = "#9bff43";
        ctx.strokeStyle = "#c7ff75";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(trail.x, trail.y, 18, 11, 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      for (const coin of coins) {
        ctx.fillStyle = "#f5d741";
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#8a6810";
        ctx.lineWidth = 2;
        ctx.stroke();
        drawText(String(coin.value), coin.x, coin.y + 4, "#141914", 11, "center");
      }

      for (const cheese of cheeses) {
        if (selectedMode === "Apocalypse") {
          // Candy cane pickup: striped stick replacing cheese in Apocalypse Mode.
          ctx.save();
          ctx.translate(cheese.x, cheese.y);
          ctx.rotate(-0.55);
          ctx.lineCap = "round";
          ctx.strokeStyle = "#fff7ed";
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.moveTo(0, 10);
          ctx.lineTo(0, -7);
          ctx.arc(0, -7, 6, Math.PI, 0, false);
          ctx.stroke();
          ctx.strokeStyle = "#e63848";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(0, 10);
          ctx.lineTo(0, -7);
          ctx.arc(0, -7, 6, Math.PI, 0, false);
          ctx.stroke();
          ctx.strokeStyle = "#fff7ed";
          ctx.lineWidth = 3;
          for (const stripeY of [-1, 6]) {
            ctx.beginPath();
            ctx.moveTo(-4, stripeY + 2);
            ctx.lineTo(4, stripeY - 2);
            ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.fillStyle = "#ffe34d";
          ctx.beginPath();
          ctx.arc(cheese.x, cheese.y, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fff1a3";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.fillStyle = "#c79d28";
          ctx.beginPath();
          ctx.arc(cheese.x - 4, cheese.y - 3, 2, 0, Math.PI * 2);
          ctx.arc(cheese.x + 4, cheese.y + 3, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (const bullet of bullets) {
        ctx.fillStyle = bullet.explosive ? "#ff9b33" : "#f5d741";
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.explosive ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const enemy of enemies) {
        const radius = enemy.size / 2;
        const color = enemy.hypnotized
          ? "#a438d1"
          : enemy.isCorrupted
            ? "#5a286f"
            : enemyTypes[enemy.type].color;
        const overlord = isOverlord(enemy);

        if (enemy.type === "flame") drawFlameGlow(enemy, radius);

        if (enemy.type === "tank") {
          drawTank(enemy, color);
        } else {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(enemy.x, enemy.y, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = enemy.isCorrupted ? "#a9ff48" : enemy.hypnotized || overlord ? "#f5d741" : "#141914";
          ctx.lineWidth = enemy.isCorrupted || overlord ? 4 : 2;
          ctx.stroke();
          if (enemy.isCorrupted) {
            drawText("☣", enemy.x, enemy.y + 6, "#baff65", 15, "center");
          }
        }

        const barWidth = overlord ? 240 : Math.max(enemy.size, 32);
        const barY = enemy.y - radius - 14;

        ctx.fillStyle = "#141914";
        ctx.fillRect(enemy.x - barWidth / 2, barY, barWidth, 8);
        ctx.fillStyle = overlord ? "#f5d741" : "#dc4137";
        ctx.fillRect(
          enemy.x - barWidth / 2,
          barY,
          barWidth * Math.max(0, enemy.hp / enemy.maxHp),
          8
        );

        if (enemy.burnTimer > 0 && !enemy.hypnotized) {
          drawText("🔥", enemy.x, enemy.y - radius - 22, "#ff9b33", 16, "center");
        }

        if (enemy.frozenTimer > 0) {
          drawText("❄", enemy.x + radius, enemy.y - radius, "#a8efff", 16, "center");
        }
      }

      if (player) {
        ctx.fillStyle = "#2d78eb";
        ctx.fillRect(player.x - 14, player.y - 14, 28, 28);
        ctx.strokeStyle = "#f5f5f5";
        ctx.lineWidth = 2;
        ctx.strokeRect(player.x - 14, player.y - 14, 28, 28);

        drawText(
          `Left-click: ${runWeapons[0] || "None"} | Right-click: ${runWeapons[1] || "None"}`,
          18, H - 19, "#f5f5f5", 16
        );
        drawText("WASD: Move   P: Pause", W - 18, H - 19, "#f5f5f5", 16, "right");
      }

      if (messageTimer > 0 && player) {
        drawText(`WAVE ${wave}`, W / 2, 125, "#f5d741", 32, "center");
      }

      if (
        paused && player && !gameover && !choosingUpgrade &&
        overlay.style.display !== "grid"
      ) {
        ctx.fillStyle = "rgba(0,0,0,.65)";
        ctx.fillRect(0, 0, W, H);
        drawText("PAUSED", W / 2, H / 2, "#f5d741", 40, "center");
        drawText("Press P to continue", W / 2, H / 2 + 55, "#f5f5f5", 22, "center");
      }

      updateWavePreview();
    }

    function frame(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.05);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    document.addEventListener("keydown", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) {
        event.preventDefault();
      }

      keys.add(key);

      if (
        key === "p" && player && !gameover && !choosingUpgrade &&
        overlay.style.display !== "grid"
      ) {
        paused = !paused;
      }
    });

    document.addEventListener("keyup", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    canvas.addEventListener("mousemove", event => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (event.clientX - rect.left) * W / rect.width;
      mouse.y = (event.clientY - rect.top) * H / rect.height;
    });

    canvas.addEventListener("mousedown", event => {
      if (event.button === 0) mouse.buttons[0] = true;
      if (event.button === 2) mouse.buttons[1] = true;
    });

    window.addEventListener("mouseup", event => {
      if (event.button === 0) mouse.buttons[0] = false;
      if (event.button === 2) mouse.buttons[1] = false;
    });

    canvas.addEventListener("contextmenu", event => event.preventDefault());

    showHomeScreen();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
